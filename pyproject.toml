[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-income-toolkit"
version = "0.2.0"
description = "Professional fixed-income analytics toolkit for Argentine Treasury instruments (LECAP / BONCAP)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Felipe Cagigas" }]
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["financial_engine*", "market_data*", "local_dashboard*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
